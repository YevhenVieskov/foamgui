name: CI for PyQt Project

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    # Use a matrix to test across different OSes (Windows, Linux, macOS)
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: [3.9, '3.12']

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Install PyQt/PySide and other project dependencies
        pip install PyQt6  # Or PySide6, PyQt5, PySide2 as needed
        pip install -r requirements.txt
    
    - name: Run tests
      run: |
        # Replace 'pytest' with your specific test command
        # You might need to set an environment variable for headless testing
        # e.g., export QT_QPA_PLATFORM=offscreen on Linux
        pytest
